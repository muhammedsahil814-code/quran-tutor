    // Helper to calculate dynamic weekly dates based on start date
    function getDynamicWeeks(startDateStr) {
      const start = startDateStr ? new Date(startDateStr) : new Date('2026-12-01');
      const weeksData = [];
      for (let w = 1; w <= 12; w++) {
        const weekStart = new Date(start);
        weekStart.setDate(start.getDate() + (w - 1) * 7);
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekStart.getDate() + 6);
        
        const options = { month: 'short', day: 'numeric' };
        const dateStr = `${weekStart.toLocaleDateString('en-US', options)} - ${weekEnd.toLocaleDateString('en-US', options)}`;
        weeksData.push({ weekNum: w, dateStr });
      }
      return weeksData;
    }

    // =========================================================================
    // 6. FOUNDER DASHBOARD
    // =========================================================================
    function FounderDashboard({ darkMode, lang, t, currentFounder, dbState, updateDb, handleResetAllData, showToast }) {
      const { founders, teachers, students, parents, studyLogs, assessments, examLinks, academyLogo } = dbState;
      const [activeTab, setActiveTab] = useState('REGISTER');

      const [regForm, setRegForm] = useState({
        studentName: '',
        studentAge: '',
        studentPassword: '',
        courseId: 'QAIDA_RECITATION',
        teacherId: teachers[0]?.id || '',
        startDate: '2026-12-01',
        parentName: '',
        parentPassword: ''
      });
      const [teacherForm, setTeacherForm] = useState({ name: '', password: '' });
      const [copiedId, setCopiedId] = useState(null);

      const [editingStudentId, setEditingStudentId] = useState(null);
      const [studentEditDraft, setStudentEditDraft] = useState(null);
      const [editingTeacherId, setEditingTeacherId] = useState(null);
      const [teacherEditDraft, setTeacherEditDraft] = useState(null);
      const [editingReportId, setEditingReportId] = useState(null);
      const [editDraft, setEditDraft] = useState(null);

      const [selectedFounderId, setSelectedFounderId] = useState(currentFounder?.id || 'fnd-1');
      const [editFounderName, setEditFounderName] = useState(
        founders.find((f) => f.id === (currentFounder?.id || 'fnd-1'))?.name || ''
      );
      const [newFounderPwd, setNewFounderPwd] = useState('');

      const pendingReports = assessments.filter((a) => a.status === 'PENDING_REVIEW');
      const approvedReports = assessments.filter((a) => a.status === 'APPROVED');

      const cardClass = darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-stone-200 text-slate-800 shadow-sm';
      const inputClass = darkMode ? 'bg-slate-950 border-slate-700 text-white focus:border-emerald-400' : 'bg-white border-stone-300 text-slate-900 focus:border-emerald-700';

      const handleRegisterStudentAndParent = (e) => {
        e.preventDefault();
        if (!regForm.studentName.trim() || !regForm.studentPassword.trim() || !regForm.parentName.trim() || !regForm.parentPassword.trim()) {
          showToast('Please fill all student and parent fields.', 'error');
          return;
        }
        const studentId = `std-${Date.now()}`;
        const parentId = `par-${Date.now() + 1}`;
        const newStudent = {
          id: studentId,
          name: regForm.studentName.trim(),
          age: Number(regForm.studentAge) || 8,
          password: regForm.studentPassword.trim(),
          role: 'STUDENT',
          courseId: regForm.courseId,
          teacherId: regForm.teacherId || teachers[0]?.id,
          startDate: regForm.startDate || '2026-12-01',
          parentId,
          completedWeeks: [],
          joinedDate: new Date().toISOString().split('T')[0]
        };
        const newParent = {
          id: parentId,
          name: regForm.parentName.trim(),
          password: regForm.parentPassword.trim(),
          role: 'PARENT',
          studentId,
          joinedDate: new Date().toISOString().split('T')[0]
        };
        updateDb({ students: [newStudent, ...students], parents: [newParent, ...parents] });
        setRegForm({
          studentName: '',
          studentAge: '',
          studentPassword: '',
          courseId: 'QAIDA_RECITATION',
          teacherId: teachers[0]?.id || '',
          startDate: '2026-12-01',
          parentName: '',
          parentPassword: ''
        });
        showToast(lang === 'en' ? 'Student & Parent accounts created!' : 'വിദ്യാർത്ഥിയുടെയും രക്ഷിതാവിന്റെയും അക്കൗണ്ട് സൃഷ്ടിച്ചു!');
      };

      const handleRegisterTeacher = (e) => {
        e.preventDefault();
        if (!teacherForm.name.trim() || !teacherForm.password.trim()) return;
        const newTeacher = {
          id: `tch-${Date.now()}`,
          name: teacherForm.name.trim(),
          password: teacherForm.password.trim(),
          role: 'TEACHER',
          joinedDate: new Date().toISOString().split('T')[0]
        };
        updateDb({ teachers: [newTeacher, ...teachers] });
        setTeacherForm({ name: '', password: '' });
        showToast(lang === 'en' ? 'New Teacher registered!' : 'പുതിയ ടീച്ചറെ രജിസ്റ്റർ ചെയ്തു!');
      };

      const handleCopyCredentials = (id, text) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        setCopiedId(id);
        showToast(lang === 'en' ? 'Credentials copied!' : 'ലോഗിൻ വിവരങ്ങൾ കോപ്പി ചെയ്തു!');
        setTimeout(() => setCopiedId(null), 2500);
      };

      const startEditStudentAndParent = (st, par) => {
        setEditingStudentId(st.id);
        setStudentEditDraft({
          studentName: st.name,
          studentAge: st.age,
          studentPassword: st.password,
          courseId: st.courseId,
          teacherId: st.teacherId,
          startDate: st.startDate || '2026-12-01',
          parentId: par?.id || '',
          parentName: par?.name || '',
          parentPassword: par?.password || ''
        });
      };

      const handleSaveStudentAndParentEdit = (studentId) => {
        if (!studentEditDraft.studentName.trim() || !studentEditDraft.studentPassword.trim()) return;
        const updatedStudents = students.map((s) =>
          s.id === studentId
            ? {
                ...s,
                name: studentEditDraft.studentName.trim(),
                age: Number(studentEditDraft.studentAge) || s.age,
                password: studentEditDraft.studentPassword.trim(),
                courseId: studentEditDraft.courseId,
                teacherId: studentEditDraft.teacherId,
                startDate: studentEditDraft.startDate
              }
            : s
        );
        const updatedParents = parents.map((p) =>
          p.id === studentEditDraft.parentId
            ? {
                ...p,
                name: studentEditDraft.parentName.trim() || p.name,
                password: studentEditDraft.parentPassword.trim() || p.password
              }
            : p
        );
        updateDb({ students: updatedStudents, parents: updatedParents });
        setEditingStudentId(null);
        setStudentEditDraft(null);
        showToast('Student & Parent updated!');
      };

      const handleDeleteStudentAndParent = (st) => {
        updateDb({
          students: students.filter((s) => s.id !== st.id),
          parents: parents.filter((p) => p.id !== st.parentId && p.studentId !== st.id)
        });
        showToast('Student & linked Parent removed.');
      };

      const startEditTeacher = (tch) => {
        setEditingTeacherId(tch.id);
        setTeacherEditDraft({ name: tch.name, password: tch.password });
      };

      const handleSaveTeacherEdit = (teacherId) => {
        if (!teacherEditDraft.name.trim() || !teacherEditDraft.password.trim()) return;
        updateDb({
          teachers: teachers.map((tch) =>
            tch.id === teacherId ? { ...tch, name: teacherEditDraft.name.trim(), password: teacherEditDraft.password.trim() } : tch
          )
        });
        setEditingTeacherId(null);
        setTeacherEditDraft(null);

                            {isPending ? t.pendingReviewBadge : t.publishedBadge}
                          </span>
                          <h3 className="font-bold text-base mt-1">
                            {st?.name || 'Student'} ({COURSES[st?.courseId]?.titleEn})
                          </h3>
                          <p className="text-xs opacity-70">
                            Week {rep.week} • Submitted by: {rep.evaluatorName}
                          </p>
                        </div>

                        {!isEditing && (
                          <div className="flex flex-wrap items-center gap-2">
                            <button
                              onClick={() => startEditReport(rep)}
                              className={`px-3.5 py-2 rounded-xl text-xs font-bold border flex items-center gap-1.5 ${
                                darkMode ? 'bg-slate-800 border-slate-700 text-slate-200' : 'bg-white border-stone-300 text-slate-800'
                              }`}
                            >
                              <Icon name="edit-3" className="w-3.5 h-3.5" /> {t.editOverrideBtn}
                            </button>
                            {isPending && (
                              <button
                                onClick={() => handleApprovePublish(rep.id)}
                                className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs flex items-center gap-1.5"
                              >
                                <Icon name="send" className="w-3.5 h-3.5" /> {t.approvePublishBtn}
                              </button>
                            )}
                          </div>
                        )}
                      </div>

                      {isEditing && editDraft ? (
                        <div className={`p-4 rounded-xl border space-y-3 ${darkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-indigo-200'}`}>
                          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <div>
                              <label className="block text-[11px] font-semibold mb-1">{t.masteryScore}</label>
                              <input
                                type="number"
                                value={editDraft.masteryScore}
                                onChange={(e) => setEditDraft({ ...editDraft, masteryScore: e.target.value })}
                                className={`w-full px-2.5 py-1.5 rounded-lg border text-xs ${inputClass}`}
                              />
                            </div>
                            <div>
                              <label className="block text-[11px] font-semibold mb-1">{t.attendanceScore}</label>
                              <input
                                type="number"
                                value={editDraft.attendanceScore}
                                onChange={(e) => setEditDraft({ ...editDraft, attendanceScore: e.target.value })}
                                className={`w-full px-2.5 py-1.5 rounded-lg border text-xs ${inputClass}`}
                              />
                            </div>
                            <div>
                              <label className="block text-[11px] font-semibold mb-1">{t.hifzDuaScore}</label>
                              <input
                                type="number"
                                value={editDraft.hifzDuaScore}
                                onChange={(e) => setEditDraft({ ...editDraft, hifzDuaScore: e.target.value })}
                                className={`w-full px-2.5 py-1.5 rounded-lg border text-xs ${inputClass}`}
                              />
                            </div>
                            <div>
                              <label className="block text-[11px] font-semibold mb-1">{t.overallGrade}</label>
                              <select
                                value={editDraft.grade}
                                onChange={(e) => setEditDraft({ ...editDraft, grade: e.target.value })}
                                className={`w-full px-2.5 py-1.5 rounded-lg border text-xs ${inputClass}`}
                              >
                                <option value="A+">A+</option>
                                <option value="A">A</option>
                                <option value="B+">B+</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                              </select>
                            </div>
                          </div>
                          <textarea
                            rows="2"
                            value={editDraft.teacherRemark}
                            onChange={(e) => setEditDraft({ ...editDraft, teacherRemark: e.target.value })}
                            className={`w-full px-3 py-2 rounded-lg border text-xs ${inputClass}`}
                          />
                          <textarea
                            rows="2"
                            value={editDraft.founderNote}
                            onChange={(e) => setEditDraft({ ...editDraft, founderNote: e.target.value })}
                            placeholder="Optional Founder note..."
                            className={`w-full px-3 py-2 rounded-lg border text-xs ${inputClass}`}
                          />
                          <div className="flex justify-end gap-2">
                            <button
                              onClick={() => {
                                setEditingReportId(null);
                                setEditDraft(null);
                              }}
                              className="px-3 py-1.5 rounded-lg bg-slate-700 text-white text-xs font-semibold"
                            >
                              Cancel
                            </button>
                            <button
                              onClick={() => handleSaveReportEdit(rep.id, true)}
                              className="px-4 py-1.5 rounded-lg bg-emerald-500 text-slate-950 text-xs font-bold"
                            >
                              Save & Publish
                            </button>
                          </div>
                        </div>
                      ) : (
                        <div className="text-xs space-y-1">
                          <p>
                            <strong>Score:</strong> {rep.score}% ({rep.grade}) • <strong>Teacher:</strong> {rep.teacherRemark}
                          </p>
                          {rep.founderNote && <p className="text-emerald-400"><strong>Founder:</strong> {rep.founderNote}</p>}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {activeTab === 'EXAMS' && (
            <ExamLinksManager darkMode={darkMode} t={t} examLinks={examLinks} updateDb={updateDb} postedBy="Founder" showToast={showToast} />
          )}

          {activeTab === 'PUBLISHED' && (
            <WeeklyReportCardViewer
              darkMode={darkMode}
              lang={lang}
              t={t}
              students={students}
              teachers={teachers}
              studyLogs={studyLogs}
              assessments={approvedReports}
              academyLogo={academyLogo}
              showToast={showToast}
            />
          )}

          {activeTab === 'CURRICULUM' && <CurriculumViewer darkMode={darkMode} lang={lang} />}

          {activeTab === 'SETTINGS' && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className={`p-6 rounded-2xl border space-y-3 ${cardClass}`}>
                <h3 className="text-base font-bold flex items-center gap-2">
                  <Icon name="image" className="w-5 h-5 text-emerald-400" />
                  {t.logoUploadTitle}
                </h3>
                <p className="text-xs opacity-70">{t.logoUploadDesc}</p>
                {academyLogo && (
                  <div className="flex items-center gap-3">
                    <img src={academyLogo} alt="Logo" className="w-14 h-14 rounded-xl object-cover bg-white border border-emerald-500/40" />
                    <button
                      type="button"
                      onClick={() => {
                        updateDb({ academyLogo: '' });
                        showToast('Logo removed.');
                      }}
                      className="px-3 py-1.5 rounded-lg bg-red-600/20 text-red-400 text-xs font-bold"
                    >
                      {t.removeLogoBtn}
                    </button>
                  </div>
                )}
                <label className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs cursor-pointer">
                  <Icon name="upload" className="w-4 h-4" />
                  <span>{t.uploadLogoBtn}</span>
                  <input type="file" accept="image/*" onChange={handleLogoFileChange} className="hidden" />
                </label>
              </div>

              <div className={`p-6 rounded-2xl border ${cardClass}`}>
                <h3 className="text-base font-bold mb-2">{t.changePwdTitle}</h3>
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    if (!editFounderName.trim()) return;
                    const updatedFounders = founders.map((f) =>
                      f.id === selectedFounderId
                        ? {
                            ...f,
                            name: editFounderName.trim(),
                            password: newFounderPwd.trim() ? newFounderPwd.trim() : f.password
                          }
                        : f
                    );
                    updateDb({ founders: updatedFounders });
                    setNewFounderPwd('');
                    showToast('Founder profile updated!');
                  }}
                  className="space-y-3"
                >
                  <select
                    value={selectedFounderId}
                    onChange={(e) => {
                      const id = e.target.value;
                      setSelectedFounderId(id);
                      setEditFounderName(founders.find((f) => f.id === id)?.name || '');
                    }}
                    className={`w-full px-3.5 py-2.5 rounded-xl border text-xs font-bold outline-none ${inputClass}`}
                  >
                    {founders.map((f) => (
                      <option key={f.id} value={f.id}>
                        {f.name} (Founder)
                      </option>
                    ))}
                  </select>
                  <input
                    type="text"
                    required
                    value={editFounderName}
                    onChange={(e) => setEditFounderName(e.target.value)}
                    placeholder={t.newNameLabel}
                    className={`w-full px-3.5 py-2.5 rounded-xl border text-sm outline-none ${inputClass}`}
                  />
                  <input
                    type="password"
                    value={newFounderPwd}
                    onChange={(e) => setNewFounderPwd(e.target.value)}
                    placeholder={`${t.newPwdLabel} (Optional)`}
                    className={`w-full px-3.5 py-2.5 rounded-xl border text-sm outline-none ${inputClass}`}
                  />
                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs"
                  >
                    {t.updatePwdBtn}
                  </button>
                </form>
              </div>

              <div className={`p-6 rounded-2xl border ${cardClass}`}>
                <h3 className="text-base font-bold mb-1">{t.resetDataTitle}</h3>
                <p className="text-xs opacity-70 mb-4">{t.resetDataDesc}</p>
                <button
                  type="button"
                  onClick={handleResetAllData}
                  className="px-4 py-2.5 rounded-xl bg-red-600/90 hover:bg-red-600 text-white font-bold text-xs flex items-center gap-2"
                >
                  <Icon name="rotate-ccw" className="w-4 h-4" />
                  {t.resetDataBtn}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 7. TEACHER DASHBOARD
    // =========================================================================
    function TeacherDashboard({ darkMode, lang, t, teacher, dbState, updateDb, showToast }) {
      const { students, studyLogs, assessments, examLinks, liveClasses = [] } = dbState;
      const [teacherTab, setTeacherTab] = useState('LIVE_CLASS');
      const assignedStudents = students.filter((s) => s.teacherId === teacher.id);
      const [selectedStudentId, setSelectedStudentId] = useState(assignedStudents[0]?.id || '');

      const [classForm, setClassForm] = useState({
        topic: '',
        courseId: assignedStudents[0]?.courseId || 'QAIDA_RECITATION',
        schedule: 'Today • 07:30 PM IST',
        mode: 'IN_APP_VIDEO',
        meetUrl: '',
        status: 'LIVE'
      });
      const [activeVideoRoom, setActiveVideoRoom] = useState(null);

      const [reportForm, setReportForm] = useState({
        week: 4,
        masteryScore: 92,
        attendanceScore: 95,
        hifzDuaScore: 90,
        grade: 'A+',
        teacherRemark: ''
      });

      const selectedStudent = assignedStudents.find((s) => s.id === selectedStudentId) || assignedStudents[0];
      const cardClass = darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-stone-200 text-slate-800 shadow-sm';
      const inputClass = darkMode ? 'bg-slate-950 border-slate-700 text-white' : 'bg-white border-stone-300 text-slate-900';

      const myLiveClasses = liveClasses.filter((c) => c.teacherId === teacher.id);

      const handlePublishClass = (e) => {
        e.preventDefault();
        if (!classForm.topic.trim()) return;
        if (classForm.mode === 'EXTERNAL_LINK' && !classForm.meetUrl.trim()) {
          showToast('Please paste a Google Meet or Zoom link.', 'error');
          return;
        }
        const roomSlug = `QuranTutor-${teacher.name.replace(/[^a-zA-Z0-9]/g, '')}-${Date.now().toString().slice(-4)}`;
        const newClass = {
          id: `cls-${Date.now()}`,
          topic: classForm.topic.trim(),
          courseId: classForm.courseId,
          teacherId: teacher.id,
          teacherName: teacher.name,
          schedule: classForm.schedule.trim(),
          mode: classForm.mode,
          roomCode: roomSlug,
          meetUrl: classForm.meetUrl.trim(),
          status: classForm.status
        };
        updateDb({ liveClasses: [newClass, ...liveClasses] });
        setClassForm({ ...classForm, topic: '', meetUrl: '' });
        showToast(lang === 'en' ? 'Live class published to students!' : 'ലൈവ് ക്ലാസ് കുട്ടികൾക്ക് നൽകി!');
      };

      const toggleWeekDone = (studentId, weekNum) => {
        updateDb({
          students: students.map((s) => {
            if (s.id === studentId) {
              const exists = s.completedWeeks.includes(weekNum);
              const updated = exists ? s.completedWeeks.filter((w) => w !== weekNum) : [...s.completedWeeks, weekNum].sort((a, b) => a - b);
              return { ...s, completedWeeks: updated };
            }
            return s;
          })
        });
        showToast(`Week ${weekNum} updated.`);
      };

      const handleReportSubmit = (e) => {
        e.preventDefault();
        if (!selectedStudent) return;
        const avg = Math.round(
          (Number(reportForm.masteryScore) + Number(reportForm.attendanceScore) + Number(reportForm.hifzDuaScore)) / 3
        );
        const newRep = {
          id: `asm-${Date.now()}`,
          studentId: selectedStudent.id,
          week: Number(reportForm.week),
          teacherId: teacher.id,
          evaluatorName: teacher.name,
          masteryScore: Number(reportForm.masteryScore),
          attendanceScore: Number(reportForm.attendanceScore),
          hifzDuaScore: Number(reportForm.hifzDuaScore),
          score: avg,
          grade: reportForm.grade,
          teacherRemark: reportForm.teacherRemark,
          founderNote: '',
          status: 'PENDING_REVIEW',
          editedByFounder: false,
          date: new Date().toISOString().split('T')[0]
        };
        updateDb({ assessments: [newRep, ...assessments] });
        setReportForm({ ...reportForm, teacherRemark: '' });
        showToast('Weekly progress report submitted for Founder review!');
      };

      return (
        <div className="space-y-6">
          {activeVideoRoom && (
            <InAppVideoModal
              room={activeVideoRoom}
              userName={`${teacher.name} (Teacher)`}
              onClose={() => setActiveVideoRoom(null)}
            />
          )}

          <div className={`flex flex-wrap gap-2 p-2 rounded-2xl border ${cardClass}`}>
            <button
              onClick={() => setTeacherTab('LIVE_CLASS')}
              className={`px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition ${
                teacherTab === 'LIVE_CLASS'
                  ? darkMode
                    ? 'bg-emerald-500 text-slate-950'
                    : 'bg-emerald-900 text-white'
                  : 'opacity-75 hover:opacity-100'
              }`}
            >
              <Icon name="video" className="w-4 h-4" />
              {t.tabLiveClass} ({myLiveClasses.length})
            </button>
            <button
              onClick={() => setTeacherTab('REPORTS')}
              className={`px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition ${
                teacherTab === 'REPORTS'
                  ? darkMode
                    ? 'bg-emerald-500 text-slate-950'
                    : 'bg-emerald-900 text-white'
                  : 'opacity-75 hover:opacity-100'
              }`}
            >
              <Icon name="file-text" className="w-4 h-4" />
              Assigned Students ({assignedStudents.length}) & Reports
            </button>
            <button
              onClick={() => setTeacherTab('EXAMS')}
              className={`px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition ${
                teacherTab === 'EXAMS'
                  ? darkMode
                    ? 'bg-emerald-500 text-slate-950'
                    : 'bg-emerald-900 text-white'
                  : 'opacity-75 hover:opacity-100'
              }`}
            >
              <Icon name="link-2" className="w-4 h-4" />
              {t.tabExams}
            </button>
          </div>

          {teacherTab === 'LIVE_CLASS' ? (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className={`lg:col-span-5 p-6 rounded-2xl border ${cardClass}`}>
                <h3 className="text-base font-bold mb-1 flex items-center gap-2">
                  <Icon name="video" className="w-5 h-5 text-emerald-400" />
                  {t.liveClassroomTitle}
                </h3>
                <p className="text-xs opacity-70 mb-4">{t.liveClassroomSub}</p>

                <form onSubmit={handlePublishClass} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold mb-1">{t.classTopicLabel}</label>
                    <input
                      type="text"
                      required
                      value={classForm.topic}
                      onChange={(e) => setClassForm({ ...classForm, topic: e.target.value })}
                      placeholder="e.g. Week 4: Noorani Qaida Lesson 5"
                      className={`w-full px-3 py-2.5 rounded-xl border text-xs outline-none ${inputClass}`}
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold mb-1">{t.selectCourse}</label>
                      <select
                        value={classForm.courseId}
                        onChange={(e) => setClassForm({ ...classForm, courseId: e.target.value })}
                        className={`w-full px-3 py-2.5 rounded-xl border text-xs outline-none ${inputClass}`}
                      >
                        <option value="QAIDA_RECITATION">Qaida & Recitation</option>
                        <option value="FIQH_BASICS">Fiqh & Duas</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold mb-1">{t.classScheduleLabel}</label>
                      <input
                        type="text"
                        required
                        value={classForm.schedule}
                        onChange={(e) => setClassForm({ ...classForm, schedule: e.target.value })}
                        className={`w-full px-3 py-2.5 rounded-xl border text-xs outline-none ${inputClass}`}
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold mb-1">{t.meetingPlatformLabel}</label>
                    <select
                      value={classForm.mode}
                      onChange={(e) => setClassForm({ ...classForm, mode: e.target.value })}
                      className={`w-full px-3 py-2.5 rounded-xl border text-xs font-bold outline-none ${inputClass}`}
                    >
                      <option value="IN_APP_VIDEO">In-App Live Video Room (Built-in Video Call)</option>
                      <option value="EXTERNAL_LINK">Google Meet / Zoom External Link</option>
                    </select>
                  </div>

                  {classForm.mode === 'EXTERNAL_LINK' && (
                    <div>
                      <label className="block text-xs font-semibold mb-1">{t.meetingLinkLabel}</label>
                      <input
                        type="url"
                        required
                        value={classForm.meetUrl}
                        onChange={(e) => setClassForm({ ...classForm, meetUrl: e.target.value })}
                        placeholder="https://meet.google.com/xxx-xxxx-xxx"
                        className={`w-full px-3 py-2.5 rounded-xl border text-xs outline-none ${inputClass}`}
                      />
                    </div>
                  )}

                  <button
                    type="submit"
                    className="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs flex items-center justify-center gap-1.5"
                  >
                    <Icon name="video" className="w-4 h-4" />
                    {t.publishClassBtn}
                  </button>
                </form>
              </div>

              <div className={`lg:col-span-7 p-6 rounded-2xl border space-y-3 ${cardClass}`}>
                <h3 className="text-base font-bold">{t.activeLiveClasses} ({myLiveClasses.length})</h3>
                {myLiveClasses.length === 0 ? (
                  <p className="text-xs opacity-60">No classes created yet. Start an In-App Video Room or add a Google Meet link.</p>
                ) : (
                  myLiveClasses.map((cls) => (
                    <div
                      key={cls.id}
                      className={`p-4 rounded-xl border text-xs space-y-2.5 ${
                        darkMode ? 'bg-slate-950/80 border-emerald-500/40' : 'bg-stone-50 border-stone-200'
                      }`}
                    >
                      <div className="flex items-center justify-between gap-2">
                        <div className="flex items-center gap-2">
                          <span className="px-2.5 py-0.5 rounded-full bg-red-600 text-white font-bold text-[10px]">
                            ● LIVE CLASSROOM
                          </span>
                          <span className="font-semibold text-emerald-400">
                            {COURSES[cls.courseId]?.titleEn}
                          </span>
                        </div>
                        <button
                          onClick={() => updateDb({ liveClasses: liveClasses.filter((item) => item.id !== cls.id) })}
                          className="text-red-400 hover:text-red-300"
                        >
                          <Icon name="trash-2" className="w-4 h-4" />
                        </button>
                      </div>

                      <p className="font-bold text-sm">{cls.topic}</p>
                      <p className="opacity-75">{cls.schedule}</p>

                      <div className="flex flex-wrap items-center justify-end gap-2 pt-1">
                        {cls.mode === 'IN_APP_VIDEO' ? (
                          <button
                            type="button"
                            onClick={() => setActiveVideoRoom(cls)}
                            className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs inline-flex items-center gap-1.5"
                          >
                            <Icon name="video" className="w-4 h-4" />
                            {t.joinInAppVideoBtn}
                          </button>
                        ) : (
                          <a
                            href={cls.meetUrl}
                            target="_blank"
                            rel="noreferrer"
                            className="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs inline-flex items-center gap-1.5"
                          >
                            <Icon name="external-link" className="w-4 h-4" />
                            {t.openMeetLinkBtn}
                          </a>
                        )}
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          ) : teacherTab === 'EXAMS' ? (
            <ExamLinksManager darkMode={darkMode} t={t} examLinks={examLinks} updateDb={updateDb} postedBy={teacher.name} showToast={showToast} />
          ) : assignedStudents.length === 0 ? (
            <div className={`p-8 rounded-2xl border text-center text-sm ${cardClass}`}>
              No students have been assigned to you by the Founder yet.
            </div>
          ) : (
            <div className={`p-6 rounded-2xl border space-y-6 ${cardClass}`}>
              <div className="flex flex-wrap gap-2">
                {assignedStudents.map((st) => (
                  <button
                    key={st.id}
                    onClick={() => setSelectedStudentId(st.id)}
                    className={`px-4 py-2.5 rounded-xl text-xs font-bold border transition ${
                      selectedStudent?.id === st.id
                        ? darkMode
                          ? 'bg-emerald-500 text-slate-950 border-emerald-400'
                          : 'bg-emerald-900 text-white border-emerald-900'
                        : darkMode
                        ? 'bg-slate-950 border-slate-800 text-slate-300'
                        : 'bg-stone-50 border-stone-200 text-slate-700'
                    }`}
                  >
                    {st.name} (Age {st.age}) • {COURSES[st.courseId]?.titleEn}
                  </button>
                ))}
              </div>

              {selectedStudent && (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  <div className="lg:col-span-6 space-y-5">
                    <div className={`p-5 rounded-2xl border ${darkMode ? 'bg-slate-950/70 border-slate-800' : 'bg-indigo-50/40 border-indigo-200'}`}>
                      <h3 className="font-bold text-base mb-1">{t.submitReportTitle}</h3>
                      <p className="text-xs opacity-70 mb-4">{t.submitReportSub}</p>
                      <form onSubmit={handleReportSubmit} className="space-y-3">
                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="block text-xs font-semibold mb-1">{t.weekLabel}</label>
                            <select
                              value={reportForm.week}
                              onChange={(e) => setReportForm({ ...reportForm, week: e.target.value })}
                              className={`w-full px-3 py-2 rounded-xl border text-xs ${inputClass}`}

    function ParentDashboard({ darkMode, lang, t, parent, dbState, updateDb, showToast }) {
      const { students, teachers, studyLogs, assessments, academyLogo } = dbState;
      const child = students.find((s) => s.id === parent.studentId) || students[0];
      const [logForm, setLogForm] = useState({
        week: child ? Math.min(child.completedWeeks.length + 1, 12) : 1,
        date: new Date().toISOString().split('T')[0],
        hours: '3.5',
        notes: ''
      });

      const cardClass = darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-stone-200 text-slate-800 shadow-sm';
      const inputClass = darkMode ? 'bg-slate-950 border-slate-700 text-white' : 'bg-white border-stone-300 text-slate-900';

      if (!child) return null;
      const approvedChildReports = assessments.filter((a) => a.studentId === child.id && a.status === 'APPROVED');

      const handleSaveStudyHours = (e) => {
        e.preventDefault();
        if (!logForm.hours || Number(logForm.hours) <= 0) return;
        const newLog = {
          id: `log-${Date.now()}`,
          studentId: child.id,
          parentName: parent.name,
          week: Number(logForm.week),
          date: logForm.date,
          hours: Number(logForm.hours),
          notes: logForm.notes.trim() || 'Home revision completed.'
        };
        updateDb({ studyLogs: [newLog, ...studyLogs] });
        setLogForm({ ...logForm, notes: '' });
        showToast('Home study hours saved!');
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div className={`lg:col-span-5 p-6 rounded-2xl border h-fit no-print ${cardClass}`}>
            <h2 className="text-lg font-bold mb-1 flex items-center gap-2">
              <Icon name="clock" className="w-5 h-5 text-amber-400" />
              {t.logHomeStudyTitle}
            </h2>
            <p className="text-xs opacity-70 mb-4">{t.logHomeStudySub}</p>
            <form onSubmit={handleSaveStudyHours} className="space-y-3.5">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold mb-1">{t.weekLabel}</label>
                  <select
                    value={logForm.week}
                    onChange={(e) => setLogForm({ ...logForm, week: e.target.value })}
                    className={`w-full px-3 py-2.5 rounded-xl border text-xs outline-none ${inputClass}`}
                  >
                    {[...Array(12)].map((_, i) => (
                      <option key={i + 1} value={i + 1}>
                        Week {i + 1}
                      </option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold mb-1">{t.studyDateLabel}</label>
                  <input
                    type="date"
                    required
                    value={logForm.date}
                    onChange={(e) => setLogForm({ ...logForm, date: e.target.value })}
                    className={`w-full px-3 py-2.5 rounded-xl border text-xs outline-none ${inputClass}`}
                  />
                </div>
              </div>
              <div>
                <label className="block text-xs font-semibold mb-1">{t.studyHoursLabel}</label>
                <input
                  type="number"
                  step="0.5"
                  min="0.5"
                  max="24"
                  required
                  value={logForm.hours}
                  onChange={(e) => setLogForm({ ...logForm, hours: e.target.value })}
                  className={`w-full px-3 py-2.5 rounded-xl border text-sm outline-none ${inputClass}`}
                />
              </div>
              <div>
                <label className="block text-xs font-semibold mb-1">{t.studyNotesLabel}</label>
                <textarea
                  rows="3"
                  required
                  value={logForm.notes}
                  onChange={(e) => setLogForm({ ...logForm, notes: e.target.value })}
                  className={`w-full px-3 py-2.5 rounded-xl border text-xs outline-none ${inputClass}`}
                />
              </div>
              <button type="submit" className="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs sm:text-sm">
                {t.saveStudyLogBtn}
              </button>
            </form>
          </div>

          <div className="lg:col-span-7">
            <WeeklyReportCardViewer
              darkMode={darkMode}
              lang={lang}
              t={t}
              students={[child]}
              teachers={teachers}
              studyLogs={studyLogs}
              assessments={approvedChildReports}
              academyLogo={academyLogo}
              showToast={showToast}
              singleMode
            />
          </div>
        </div>
      );
    }

    function WeeklyReportCardViewer({ darkMode, lang, t, students, teachers, studyLogs, assessments, academyLogo, showToast, singleMode = false }) {
      const [selectedId, setSelectedId] = useState(students[0]?.id || '');
      const student = students.find((s) => s.id === selectedId) || students[0];
      const cardClass = darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-stone-200 text-slate-800 shadow-sm';

      if (!student) return null;
      const course = COURSES[student.courseId] || COURSES.QAIDA_RECITATION;
      const teacher = teachers.find((tch) => tch.id === student.teacherId);
      const stLogs = studyLogs.filter((l) => l.studentId === student.id);
      const stReports = assessments.filter((a) => a.studentId === student.id);
      const latest = stReports[0];
      const totalHours = stLogs.reduce((sum, l) => sum + Number(l.hours), 0);

      const handleShare = () => {
        const text =
          `*Quran Tutor — Weekly Progress Report*\nStudent: ${student.name} (Age ${student.age})\n` +
          `Course: ${course.titleEn}\nTeacher: ${teacher?.name || '-'}\nClasses Completed: ${student.completedWeeks.length * 3} / 36\n` +
          `Home Study Hours: ${totalHours} hrs\n` +
          (latest ? `Latest Verified Grade: ${latest.grade} (${latest.score}%)\nRemarks: ${latest.founderNote || latest.teacherRemark}` : '');
        if (navigator.clipboard) navigator.clipboard.writeText(text);
        showToast('Report summary copied!');
      };

      return (
        <div className="space-y-4">
          {!singleMode && (
            <div className={`p-4 rounded-2xl border flex items-center gap-3 no-print ${cardClass}`}>
              <span className="text-xs font-bold opacity-75">{t.roleStudent}:</span>
              <select
                value={selectedId}
                onChange={(e) => setSelectedId(e.target.value)}
                className={`px-3 py-2 rounded-xl border text-xs font-bold outline-none ${
                  darkMode ? 'bg-slate-950 border-slate-700 text-white' : 'bg-stone-50 border-stone-300'
                }`}
              >
                {students.map((s) => (
                  <option key={s.id} value={s.id}>
                    {s.name}
                  </option>
                ))}
              </select>
            </div>
          )}

          <div className={`rounded-2xl border overflow-hidden ${cardClass}`}>
            <div
              className={`p-6 flex flex-wrap items-center justify-between gap-4 border-b ${
                darkMode ? 'bg-gradient-to-r from-emerald-950 to-slate-900 border-slate-800' : 'bg-emerald-950 text-white border-emerald-900'
              }`}
            >
              <div className="flex items-center gap-3">
                {academyLogo && <img src={academyLogo} alt="Logo" className="w-12 h-12 rounded-xl object-cover bg-white border border-amber-400/50" />}
                <div>
                  <span className="text-[11px] uppercase tracking-widest font-bold text-amber-400">{t.officialReportCard}</span>
                  <h3 className="text-xl font-bold text-white mt-0.5">{t.brandName}</h3>
                  <p className="text-xs text-emerald-200">{t.brandTagline}</p>
                </div>
              </div>
              <div className="flex items-center gap-2 no-print">
                <button onClick={handleShare} className="px-3 py-2 rounded-xl bg-amber-400 text-slate-950 font-bold text-xs flex items-center gap-1.5">
                  <Icon name="share-2" className="w-3.5 h-3.5" /> {t.shareSummary}
                </button>
                <button onClick={() => window.print()} className="px-3 py-2 rounded-xl bg-slate-800 text-white font-bold text-xs flex items-center gap-1.5">
                  <Icon name="printer" className="w-3.5 h-3.5" /> {t.printCard}
                </button>
              </div>
            </div>

            <div className="p-6 space-y-5">
              <div className={`grid grid-cols-1 sm:grid-cols-3 gap-3 p-4 rounded-xl border text-xs ${darkMode ? 'bg-slate-950/70 border-slate-800' : 'bg-stone-50 border-stone-200'}`}>
                <div>
                  <span className="opacity-60 block">{t.studentName}</span>
                  <span className="font-bold text-sm">
                    {student.name} (Age {student.age})
                  </span>
                </div>
                <div>
                  <span className="opacity-60 block">Course</span>
                  <span className="font-bold text-emerald-400">{lang === 'en' ? course.titleEn : course.titleMl}</span>
                </div>
                <div>
                  <span className="opacity-60 block">{t.roleTeacher}</span>
                  <span className="font-bold">{teacher?.name || '-'}</span>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-3 text-center">
                <div className={`p-3.5 rounded-xl border ${darkMode ? 'bg-slate-950/70 border-slate-800' : 'bg-emerald-50 border-emerald-200'}`}>
                  <p className="text-[11px] opacity-70">{t.classesCompletedStat}</p>
                  <p className="text-lg font-bold text-emerald-400 mt-0.5">{student.completedWeeks.length * 3} / 36</p>
                </div>
                <div className={`p-3.5 rounded-xl border ${darkMode ? 'bg-slate-950/70 border-slate-800' : 'bg-amber-50 border-amber-200'}`}>
                  <p className="text-[11px] opacity-70">{t.homeStudyHoursStat}</p>
                  <p className="text-lg font-bold text-amber-400 mt-0.5">{totalHours} hrs</p>
                </div>
                <div className={`p-3.5 rounded-xl border ${darkMode ? 'bg-slate-950/70 border-slate-800' : 'bg-purple-50 border-purple-200'}`}>
                  <p className="text-[11px] opacity-70">{t.latestGradeStat}</p>
                  <p className="text-lg font-bold text-purple-400 mt-0.5">{latest ? `${latest.grade} (${latest.score}%)` : 'Pending'}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CurriculumViewer({ darkMode, lang }) {
      const [courseKey, setCourseKey] = useState('QAIDA_RECITATION');
      const course = COURSES[courseKey];
      const cardClass = darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-stone-200 text-slate-800 shadow-sm';

      return (
        <div className="space-y-4">
          <div className="flex flex-wrap gap-2">
            <button
              onClick={() => setCourseKey('QAIDA_RECITATION')}
              className={`px-4 py-2.5 rounded-xl text-xs font-bold ${
                courseKey === 'QAIDA_RECITATION' ? 'bg-emerald-500 text-slate-950' : darkMode ? 'bg-slate-900 text-slate-300 border border-slate-800' : 'bg-white border'
              }`}
            >
              Course 1: {lang === 'en' ? COURSES.QAIDA_RECITATION.titleEn : COURSES.QAIDA_RECITATION.titleMl}
            </button>
            <button
              onClick={() => setCourseKey('FIQH_BASICS')}
              className={`px-4 py-2.5 rounded-xl text-xs font-bold ${
                courseKey === 'FIQH_BASICS' ? 'bg-emerald-500 text-slate-950' : darkMode ? 'bg-slate-900 text-slate-300 border border-slate-800' : 'bg-white border'
              }`}
            >
              Course 2: {lang === 'en' ? COURSES.FIQH_BASICS.titleEn : COURSES.FIQH_BASICS.titleMl}
            </button>
          </div>

          {course.months.map((m) => (
            <div key={m.month} className={`rounded-2xl border overflow-hidden ${cardClass}`}>
              <div className={`px-5 py-3 font-bold text-sm border-b ${darkMode ? 'bg-slate-950 border-slate-800 text-emerald-400' : 'bg-emerald-950 text-amber-300'}`}>
                {lang === 'en' ? m.titleEn : m.titleMl}
              </div>
              <div className={`divide-y ${darkMode ? 'divide-slate-800' : 'divide-stone-100'}`}>
                {m.weeks.map((w) => (
                  <div key={w.week} className="p-4 text-xs">
                    <div className="font-bold text-emerald-400 mb-1">
                      Week {w.week} • {w.classes}
                    </div>
                    <p className="font-bold text-sm mb-1">{lang === 'en' ? w.topicEn : w.topicMl}</p>
                    <ul className="list-disc list-inside opacity-80">
                      {w.details.map((d, i) => (
                        <li key={i}>{d}</li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function InAppVideoModal({ room, userName, onClose }) {
      const encodedName = encodeURIComponent(userName || 'Quran Tutor User');
      const roomName = encodeURIComponent(room.roomCode || 'QuranTutorLiveClass');
      const jitsiUrl = `https://meet.jit.si/${roomName}#userInfo.displayName="${encodedName}"&config.prejoinPageEnabled=false`;

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-sm flex flex-col p-3 sm:p-6">
          <div className="max-w-6xl w-full mx-auto flex-1 flex flex-col bg-slate-900 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl">
            <div className="px-4 py-3 bg-slate-950 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2.5">
                <span className="px-2.5 py-0.5 rounded-full bg-red-600 text-white text-[10px] font-bold">
                  ● IN-APP LIVE VIDEO
                </span>
                <h4 className="font-bold text-sm sm:text-base text-white truncate max-w-md">
                  {room.topic}
                </h4>
              </div>
              <div className="flex items-center gap-2">
                <a
                  href={jitsiUrl}
                  target="_blank"
                  rel="noreferrer"
                  className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-300 text-xs font-bold inline-flex items-center gap-1"
                >
                  Open Full Tab <Icon name="external-link" className="w-3.5 h-3.5" />
                </a>
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3.5 py-1.5 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold inline-flex items-center gap-1"
                >
                  Leave Class <Icon name="x" className="w-4 h-4" />
                </button>
              </div>
            </div>

            <div className="flex-1 bg-black relative">
              <iframe
                src={jitsiUrl}
                allow="camera; microphone; fullscreen; display-capture; autoplay"
                className="w-full h-full border-0"
                title="Quran Tutor Live Video Classroom"
              />
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
